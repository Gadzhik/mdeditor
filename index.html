<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MD Editor</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23333'/%3E%3Cpath d='M6 22V10h3l3 4 3-4h3v12h-3v-7l-3 4-3-4v7zm17 0-4-5h3v-7h2v7h3z' fill='%23fff'/%3E%3C/svg%3E" />
  </head>
  <body>
    <header id="toolbar">
      <button id="btn-sidebar" class="icon" title="Боковая панель (Ctrl+\)">☰</button>
      <button id="btn-new" title="Новый документ">Новый</button>
      <button id="btn-open" title="Открыть файл (Ctrl+O)">Открыть</button>
      <button id="btn-folder" title="Открыть папку">Папка</button>
      <button id="btn-save" title="Сохранить (Ctrl+S), сохранить как (Ctrl+Shift+S)">Сохранить</button>
      <span id="filename"></span>
      <span class="spacer"></span>
      <span id="stats"></span>
      <div class="seg" id="mode-switch">
        <button data-mode="editor" title="Только редактор (Alt+1)">Редактор</button>
        <button data-mode="split" title="Редактор и превью (Alt+2)">Split</button>
        <button data-mode="preview" title="Режим чтения (Alt+3)">Чтение</button>
      </div>
      <button id="btn-zoom" title="Масштаб текста (Ctrl+= / Ctrl+− / Ctrl+0). Клик возвращает 100%">100%</button>
      <div id="width-ctl">
        <button id="btn-width" class="icon" title="Ширина текста (Alt+[ / Alt+])">↔</button>
        <div id="width-pop" hidden>
          <div class="row"><span>Ширина текста</span><output id="width-val"></output></div>
          <input type="range" id="width-range" min="500" max="2000" step="20" />
          <label class="row"><input type="checkbox" id="width-full" /> Во всю ширину</label>
        </div>
      </div>
      <button id="btn-notes" title="Заметки к тексту. Выделите фрагмент и нажмите Alt+N, чтобы добавить">Заметки<span id="notes-count"></span></button>
      <button id="btn-theme" title="Тема"></button>
    </header>
    <main id="app" data-mode="split">
      <aside id="sidebar" hidden>
        <div id="sidebar-head">
          <span id="folder-name">Папка не открыта</span>
          <button id="btn-restore" hidden>Восстановить доступ</button>
        </div>
        <nav id="tree"></nav>
      </aside>
      <section id="editor-pane"></section>
      <div id="divider" title="Перетащите, чтобы изменить ширину"></div>
      <article id="preview-pane"><div id="preview" class="markdown-body"></div></article>
      <section id="pdf-pane" class="invert" hidden>
        <div id="pdf-toolbar">
          <button id="pdf-btn-side" title="Миниатюры страниц и оглавление">Панель</button>
          <span class="pdf-pages">
            <input id="pdf-page" type="number" min="1" value="1" title="Номер страницы" />
            <span>/</span>
            <span id="pdf-count">0</span>
          </span>
          <span class="pdf-zoom">
            <button id="pdf-zoom-out" class="icon" title="Уменьшить (Ctrl+−)">−</button>
            <select id="pdf-scale" title="Масштаб">
              <option value="page-width">По ширине</option>
              <option value="page-fit">Страница целиком</option>
              <option value="0.5">50%</option>
              <option value="0.75">75%</option>
              <option value="1">100%</option>
              <option value="1.25">125%</option>
              <option value="1.5">150%</option>
              <option value="2">200%</option>
              <option value="3">300%</option>
              <option data-custom hidden></option>
            </select>
            <button id="pdf-zoom-in" class="icon" title="Увеличить (Ctrl+=)">+</button>
          </span>
          <span class="spacer"></span>
          <span class="pdf-find">
            <input id="pdf-find" type="search" placeholder="Поиск (Ctrl+F)" />
            <span id="pdf-find-count"></span>
            <button id="pdf-find-prev" class="icon" title="Предыдущее (Shift+Enter)">↑</button>
            <button id="pdf-find-next" class="icon" title="Следующее (Enter)">↓</button>
          </span>
          <button id="pdf-invert" class="icon" title="Инвертировать страницы в тёмной теме">◑</button>
          <button id="pdf-close" class="icon" title="Закрыть PDF и вернуться к заметке">✕</button>
        </div>
        <div id="pdf-body">
          <aside id="pdf-side" data-tab="thumbs">
            <div class="pdf-tabs">
              <button data-tab="thumbs">Страницы</button>
              <button data-tab="outline">Оглавление</button>
            </div>
            <div id="pdf-thumbs"></div>
            <nav id="pdf-outline"></nav>
          </aside>
          <div id="pdf-main">
            <div id="pdf-container" tabindex="0"><div id="pdf-viewer" class="pdfViewer"></div></div>
            <div id="pdf-loading" hidden>Загрузка…</div>
          </div>
        </div>
      </section>
      <aside id="notes-panel" hidden>
        <div id="notes-head">
          <span>Заметки</span>
          <span class="spacer"></span>
          <div id="notes-export-wrap">
            <button id="notes-export" title="Экспорт заметок в Markdown">Экспорт</button>
            <div id="notes-export-menu" hidden>
              <button data-export="file">Сохранить в файл .md</button>
              <button data-export="copy">Скопировать как Markdown</button>
              <button data-export="open">Открыть в редакторе</button>
            </div>
          </div>
          <button id="notes-close" class="icon" title="Скрыть панель">✕</button>
        </div>
        <div id="notes-list"></div>
        <div id="notes-where"></div>
      </aside>
    </main>
    <button id="note-add" hidden title="Добавить заметку к выделенному (Alt+N)">＋ Заметка</button>
    <div id="note-pop" hidden>
      <blockquote id="note-pop-quote"></blockquote>
      <textarea id="note-pop-text" rows="4" placeholder="Текст заметки (можно оставить пустым — тогда это просто выделение)"></textarea>
      <div class="note-pop-row">
        <button id="note-pop-del">Удалить</button>
        <span class="spacer"></span>
        <button id="note-pop-cancel" title="Esc">Отмена</button>
        <button id="note-pop-save" class="primary" title="Ctrl+Enter">Сохранить</button>
      </div>
    </div>
    <div id="dropzone" hidden><div>Отпустите файл (.md, .pdf) или папку, чтобы открыть</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
